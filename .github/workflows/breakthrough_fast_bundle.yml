name: Breakthrough Fast Bundle

on:
  push:
    branches: [codex/genuine-breakthrough-search]
    paths:
      - ".github/workflows/breakthrough_fast_bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/genuine-breakthrough-search
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow requests tabulate scikit-learn scipy
      - name: Run FOP
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python research/first_observation_provenance.py 2>&1 | tee research/results/fop_run.log
      - name: Run MTF remaining-time screen
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python research/mtf_remaining_time_audit.py 2>&1 | tee research/results/mtf_remaining_run.log
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/fop research/results/fop_run.log research/results/mtf_remaining research/results/mtf_remaining_run.log || true
          if ! git diff --cached --quiet; then
            git commit -m "Fast breakthrough bundle results [skip ci]"
            git push origin HEAD:codex/genuine-breakthrough-search
          fi
