name: Dynamic Pair Completion Data Audit

on:
  push:
    branches:
      - codex/dynamic-pair-completion
    paths:
      - "research/inspect_dynamic_pair_data.py"
      - "capture/**"
      - "data/**"
      - ".github/workflows/dynamic_pair_completion.yml"

permissions:
  contents: read

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip dpc]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: codex/dynamic-pair-completion

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fail-closed data audit
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p research/results
          python research/inspect_dynamic_pair_data.py > research/results/dpc_data_audit.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat research/results/dpc_data_audit.log
          exit 0

      - name: Publish machine-readable evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/results/dpc_data_audit.json')
          if not p.exists():
              print('::error title=DPC_DATA_AUDIT::audit JSON missing')
              raise SystemExit(1)
          r = json.loads(p.read_text())
          a = r.get('alignment', {})
          compact = {
              'verdict': a.get('verdict'),
              'orders_rows': a.get('orders_rows'),
              'lsm_orders': a.get('lsm_orders'),
              'fills_rows': a.get('fills_rows'),
              'lsm_fill_rows': a.get('lsm_fill_rows'),
              'capture_book_rows': a.get('capture_book_rows'),
              'capture_trade_rows': a.get('capture_trade_rows'),
              'book_overlap': a.get('book_overlap'),
              'trade_overlap': a.get('trade_overlap'),
              'orders_columns': a.get('orders_columns'),
              'fills_columns': a.get('fills_columns'),
              'book_columns': a.get('book_columns'),
              'tape_columns': a.get('tape_columns'),
              'sqlite_table_rows': {
                  k: v.get('rows', 0)
                  for k, v in r.get('sqlite', {}).get('tables', {}).items()
              },
              'parquets': r.get('parquets'),
          }
          message = json.dumps(compact, separators=(',', ':'))
          print(f'::notice title=DPC_DATA_AUDIT::{message}')
          with open(Path.home() / 'dpc_summary.txt', 'w') as fh:
              fh.write(message)
          PY

      - name: Fail workflow if audit failed
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit 1
