name: Incentive-Adjusted CRYPTO15M Audit

on:
  push:
    branches:
      - codex/incentive-adjusted-edge
    paths:
      - "research/incentive_adjusted_edge.py"
      - ".github/workflows/incentive_adjusted_edge.yml"

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip incentives]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/incentive-adjusted-edge

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Query current programs and calculate reward bounds
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p research/results
          python research/incentive_adjusted_edge.py > research/results/incentive_adjusted_run.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat research/results/incentive_adjusted_run.log
          exit 0

      - name: Commit evidence or failure log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/results/incentive_adjusted_run.log
          for f in \
            research/results/incentive_adjusted_report.md \
            research/results/incentive_adjusted_summary.json \
            research/results/incentive_programs_raw.json \
            research/results/crypto15m_incentive_programs.csv \
            research/results/crypto15m_liquidity_reward_bounds.csv; do
              if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Incentive-adjusted edge audit results [skip incentives]"
            git push origin HEAD:codex/incentive-adjusted-edge
          fi

      - name: Fail workflow if audit failed
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit 1
