name: Settlement Probability and Minute-Zero Audit

on:
  push:
    branches:
      - codex/settlement-probability-engine
    paths:
      - "research/spe_*.py"
      - "research/run_settlement_probability_engine.py"
      - "research/minute00_delay_audit.py"
      - "research/run_minute00_delay_audit_v2.py"
      - "data/**"
      - ".github/workflows/spe_audit.yml"

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip combined-audit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/settlement-probability-engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scipy scikit-learn

      - name: Run proxy-free top-of-hour audit
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p research/results
          python research/run_minute00_delay_audit_v2.py > research/results/minute00_combined_run.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat research/results/minute00_combined_run.log
          exit 0

      - name: Commit evidence or failure log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/results/minute00_combined_run.log
          for f in research/results/minute00_report.md research/results/minute00_summary.json research/results/minute00_wait_sensitivity.csv research/results/minute00_leave_one_coin.csv research/results/minute00_leave_one_week.csv research/results/minute00_cap_one_trades.parquet; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Proxy-free minute-zero audit results [skip combined-audit]"
            git push origin HEAD:codex/settlement-probability-engine
          fi

      - name: Fail workflow if audit failed
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit 1
