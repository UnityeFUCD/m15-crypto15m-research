name: FOP Audit

# Explicit trigger revision after the preregistration and implementation landed.
on:
  push:
    branches: [codex/genuine-breakthrough-search]
    paths:
      - "research/first_observation_provenance.py"
      - "research/first_observation_provenance_preregistration.md"
      - ".github/workflows/fop_audit.yml"
      - "data/paths_full.parquet"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/genuine-breakthrough-search
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow tabulate
      - name: Run audit
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python research/first_observation_provenance.py 2>&1 | tee research/results/fop_run.log
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/fop research/results/fop_run.log || true
          if ! git diff --cached --quiet; then
            git commit -m "FOP unsampled audit results [skip ci]"
            git push origin HEAD:codex/genuine-breakthrough-search
          fi
