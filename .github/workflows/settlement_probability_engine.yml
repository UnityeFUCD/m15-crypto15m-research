name: Settlement Probability Engine Audit

on:
  push:
    branches:
      - codex/settlement-probability-engine
    paths:
      - "research/settlement_probability_engine.py"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/settlement_probability_engine.yml"

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip spe]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/settlement-probability-engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scipy scikit-learn

      - name: Run clean-room SPE audit
        id: spe
        shell: bash
        run: |
          set +e
          mkdir -p research/results
          python research/settlement_probability_engine.py > research/results/spe_run.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -200 research/results/spe_run.log
          exit 0

      - name: Commit generated evidence or failure log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/results/spe_run.log
          for f in \
            research/results/spe_report.md \
            research/results/spe_summary.json \
            research/results/spe_probability_metrics.csv \
            research/results/spe_validation_policy_grid.csv \
            research/results/spe_test_leave_one_coin.csv \
            research/results/spe_test_leave_one_week.csv \
            research/results/spe_test_residual_deciles.csv \
            research/results/spe_test_selected_trades.parquet; do
              if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Settlement probability engine audit results [skip spe]"
            git push origin HEAD:codex/settlement-probability-engine
          fi

      - name: Fail workflow if audit failed
        if: ${{ steps.spe.outputs.exit_code != '0' }}
        run: exit 1
