name: Paired Maker Lock Audit

on:
  push:
    branches:
      - codex/paired-maker-lock
    paths:
      - "research/paired_maker_lock.py"
      - "data/**"
      - ".github/workflows/paired_maker_lock.yml"

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip pml]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/paired-maker-lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run paired-maker audit
        id: pml
        shell: bash
        run: |
          set +e
          mkdir -p research/results
          python research/paired_maker_lock.py > research/results/pml_run.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -200 research/results/pml_run.log
          exit 0

      - name: Commit evidence or failure log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/results/pml_run.log
          for f in \
            research/results/pml_report.md \
            research/results/pml_summary.json \
            research/results/pml_validation_grid.csv \
            research/results/pml_leave_one_coin.csv \
            research/results/pml_leave_one_week.csv \
            research/results/pml_branch_economics.csv \
            research/results/pml_test_selected.parquet; do
              if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Paired maker lock audit results [skip pml]"
            git push origin HEAD:codex/paired-maker-lock
          fi

      - name: Fail workflow if audit failed
        if: ${{ steps.pml.outputs.exit_code != '0' }}
        run: exit 1
