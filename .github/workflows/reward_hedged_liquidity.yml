name: Reward-Funded Hedged Liquidity Audit

on:
  push:
    branches:
      - codex/reward-adjusted-commodity15m
    paths:
      - "research/reward_adjusted_commodity15m.py"
      - "research/reward_adjusted_commodity15m_onesided.py"
      - "research/reward_hedged_liquidity.py"
      - ".github/workflows/reward_hedged_liquidity.yml"

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip rfhl]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/reward-adjusted-commodity15m

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run reward-funded hedge audit
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p research/results
          python research/reward_hedged_liquidity.py > research/results/rfhl_run.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -300 research/results/rfhl_run.log
          exit 0

      - name: Commit evidence or failure log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/results/rfhl_run.log
          for f in \
            research/results/rfhl_report.md \
            research/results/rfhl_summary.json \
            research/results/rfhl_validation_grid.csv \
            research/results/rfhl_leave_one_strict.csv \
            research/results/rfhl_leave_one_touch.csv \
            research/results/rfhl_test_*.parquet; do
              if compgen -G "$f" > /dev/null; then git add -f $f; fi
          done
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Reward-funded hedged liquidity results [skip rfhl]"
            git push origin HEAD:codex/reward-adjusted-commodity15m
          fi

      - name: Fail workflow if audit failed
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit 1
