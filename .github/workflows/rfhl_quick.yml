name: RFHL Seven-Day Discovery Audit

on:
  push:
    branches:
      - codex/rfhl-quick
    paths:
      - "research/reward_adjusted_commodity15m.py"
      - "research/reward_adjusted_commodity15m_onesided.py"
      - "research/reward_hedged_liquidity.py"
      - "research/commodity15m_reward_data_fast.py"
      - "research/run_rfhl_quick.py"
      - ".github/workflows/rfhl_quick.yml"
  pull_request:
    branches:
      - master
    paths:
      - "research/reward_adjusted_commodity15m.py"
      - "research/reward_adjusted_commodity15m_onesided.py"
      - "research/reward_hedged_liquidity.py"
      - "research/commodity15m_reward_data_fast.py"
      - "research/run_rfhl_quick.py"
      - ".github/workflows/rfhl_quick.yml"

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip rfhl-quick]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/rfhl-quick
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run rapid RFHL audit
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p research/results
          python research/run_rfhl_quick.py > research/results/rfhl_quick_run.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -300 research/results/rfhl_quick_run.log
          exit 0
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/results/rfhl_quick_run.log
          for f in research/results/rfhl_report.md research/results/rfhl_summary.json research/results/rfhl_validation_grid.csv research/results/rfhl_leave_one_strict.csv research/results/rfhl_leave_one_touch.csv; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          for f in research/results/rfhl_test_*.parquet; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "RFHL seven-day discovery results [skip rfhl-quick]"
            git push origin HEAD:codex/rfhl-quick
          fi
      - name: Fail workflow if audit failed
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit 1
