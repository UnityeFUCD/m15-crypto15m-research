name: Probe Then Commit Audit

on:
  push:
    branches:
      - codex/probe-then-commit-audit
    paths:
      - "research/probe_then_commit_audit.py"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/probe_then_commit_audit.yml"

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip audit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/probe-then-commit-audit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate

      - name: Run clean-room audit
        run: python research/probe_then_commit_audit.py

      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/probe_then_commit_report.md \
                  research/results/probe_then_commit_summary.json \
                  research/results/probe_fill_horizons.csv \
                  research/results/fr2_full_population.csv \
                  research/results/ptc_sensitivity.csv \
                  research/results/reversal_hazard.csv
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Probe-then-commit audit results [skip audit]"
          git push origin HEAD:codex/probe-then-commit-audit
