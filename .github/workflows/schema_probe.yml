name: Schema Probe

on:
  push:
    branches: [codex/genuine-breakthrough-search]
    paths:
      - "research/probe_new_series_schema.py"
      - ".github/workflows/schema_probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/genuine-breakthrough-search
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow
      - name: Probe
        run: python research/probe_new_series_schema.py | tee research/results/schema_probe.log
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/schema_probe.log || true
          if ! git diff --cached --quiet; then
            git commit -m "Breadth data schema probe [skip ci]"
            git push origin HEAD:codex/genuine-breakthrough-search
          fi
