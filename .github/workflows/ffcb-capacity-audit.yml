name: FFCB capacity audit
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch targeted crypto combo history
        run: python research/mve_crypto_collection_history_ci.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: mve_crypto_collection_history.json
          if-no-files-found: ignore
