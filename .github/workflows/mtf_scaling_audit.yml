name: MTF Scaling Audit

on:
  push:
    branches: [codex/genuine-breakthrough-search]
    paths:
      - "research/mtf_scaling_audit.py"
      - "research/mtf_scaling_preregistration.md"
      - ".github/workflows/mtf_scaling_audit.yml"
      - "research/results/mtf/one_sided_frontiers.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/genuine-breakthrough-search
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas tabulate
      - run: python research/mtf_scaling_audit.py | tee research/results/mtf_scaling_run.log
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/mtf_scaling research/results/mtf_scaling_run.log || true
          if ! git diff --cached --quiet; then
            git commit -m "MTF scaling audit results [skip ci]"
            git push origin HEAD:codex/genuine-breakthrough-search
          fi
