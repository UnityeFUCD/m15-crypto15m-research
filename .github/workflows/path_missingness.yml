name: Path Missingness Diagnosis

on:
  push:
    branches: [master]
    paths:
      - "research/diagnose_path_missingness.py"
      - "data/**"
      - ".github/workflows/path_missingness.yml"

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip path-missing]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate
      - id: audit
        shell: bash
        run: |
          set +e
          mkdir -p research/results
          python research/diagnose_path_missingness.py > research/results/path_missingness_run.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat research/results/path_missingness_run.log
          exit 0
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/results/path_missingness_*.csv \
                     research/results/path_missingness_*.json \
                     research/results/path_missingness_*.md \
                     research/results/path_missingness_run.log || true
          if ! git diff --cached --quiet; then
            git commit -m "Path missingness diagnosis [skip path-missing]"
            git push origin HEAD:master
          fi
      - if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit 1
