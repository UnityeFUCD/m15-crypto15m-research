name: PTC Adversarial Double Test

on:
  push:
    branches:
      - master
    paths:
      - "research/probe_then_commit_adversarial.py"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/ptc_adversarial.yml"

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip adversarial]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate

      - name: Run direct-live adversarial audit
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p research/results
          python research/probe_then_commit_adversarial.py > research/results/ptc_adversarial_run.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat research/results/ptc_adversarial_run.log
          exit 0

      - name: Commit results or failure log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/results/ptc_adversarial_run.log
          for f in \
            research/results/ptc_direct_live.csv \
            research/results/ptc_direct_branches.csv \
            research/results/ptc_direct_sensitivity.csv \
            research/results/ptc_adversarial_summary.json \
            research/results/ptc_adversarial_report.md; do
              if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "PTC adversarial double-test results [skip adversarial]"
            git push origin HEAD:master
          fi

      - name: Fail workflow if audit failed
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit 1
