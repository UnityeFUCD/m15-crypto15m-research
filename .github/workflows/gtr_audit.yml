name: GTR Audit

on:
  push:
    branches: [codex/genuine-breakthrough-search]
    paths:
      - "research/gold_tail_reward_audit.py"
      - "research/gtr_preregistration.md"
      - ".github/workflows/gtr_audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/genuine-breakthrough-search
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow requests tabulate
      - name: Load frozen vendor code
        run: |
          git fetch origin codex/reward-adjusted-commodity15m
          mkdir -p .rfla_vendor/research
          touch .rfla_vendor/research/__init__.py
          git show origin/codex/reward-adjusted-commodity15m:research/reward_adjusted_commodity15m.py > .rfla_vendor/research/reward_adjusted_commodity15m.py
          git show origin/codex/reward-adjusted-commodity15m:research/commodity15m_reward_data_fast.py > .rfla_vendor/research/commodity15m_reward_data_fast.py
          git show origin/codex/reward-adjusted-commodity15m:research/reward_adjusted_commodity15m_onesided.py > .rfla_vendor/research/reward_adjusted_commodity15m_onesided.py
      - name: Run audit
        env:
          PYTHONIOENCODING: utf-8
          RFLA_VENDOR_ROOT: ${{ github.workspace }}/.rfla_vendor
        run: |
          set -o pipefail
          python research/gold_tail_reward_audit.py 2>&1 | tee research/results/gtr_run.log
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/gtr research/results/gtr_run.log || true
          if ! git diff --cached --quiet; then
            git commit -m "GTR audit results [skip ci]"
            git push origin HEAD:codex/genuine-breakthrough-search
          fi
