name: PTC Adversarial V2

on:
  push:
    branches: [master]
    paths:
      - "research/ptc_adversarial_v2.py"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/ptc_adversarial_v2.yml"

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ptc-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate
      - name: Run audit
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p research/results
          python research/ptc_adversarial_v2.py > research/results/ptc_v2_run.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat research/results/ptc_v2_run.log
          exit 0
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/results/ptc_v2_run.log
          for f in \
            research/results/ptc_v2_orders.csv \
            research/results/ptc_v2_branches.csv \
            research/results/ptc_v2_sensitivity.csv \
            research/results/ptc_v2_summary.json \
            research/results/ptc_v2_report.md; do
              if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "PTC v2 timestamp-corrected audit results [skip ptc-v2]"
            git push origin HEAD:master
          fi
      - name: Fail if audit failed
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit 1
