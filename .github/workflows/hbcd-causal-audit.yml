name: HBCD Causal Dominance-Lock Audit

on:
  push:
    branches:
      - research/gpt56-hedge-before-confirm
    paths:
      - "research/HBCD_FROZEN_SPEC.md"
      - "research/hbcd_causal_audit.py"
      - ".github/workflows/hbcd-causal-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip hbcd]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HBCD_START: "2026-07-31"
      HBCD_MAX_PAGES_PER_DAY: "75"
      HBCD_MAX_CANDLE_AGE_SECONDS: "90"
      HBCD_HTTP_SLEEP: "0.06"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/gpt56-hedge-before-confirm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run frozen public-history audit
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p research/results
          python research/hbcd_causal_audit.py > research/results/hbcd_run.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -300 research/results/hbcd_run.log
          exit 0

      - name: Commit generated evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            research/results/hbcd_run.log \
            research/results/hbcd_mechanical.json \
            research/results/hbcd_market_funnel.csv \
            research/results/hbcd_all_candidate_rows.csv \
            research/results/hbcd_contestability_rows.csv \
            research/results/hbcd_cell_summary.csv \
            research/results/hbcd_report.md \
            research/results/hbcd_run_metadata.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No generated evidence to commit"
          else
            git commit -m "HBCD causal audit results [skip hbcd]"
            git push origin HEAD:research/gpt56-hedge-before-confirm
          fi

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbcd-causal-audit
          path: |
            research/results/hbcd_*
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if audit failed
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit 1
